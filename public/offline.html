<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нет соединения · Balans</title>
    <!-- Shown by sw.js without network: no fonts or scripts from the server, colors copied from globals.css. -->
    <style>
      :root {
        --background: oklch(0.975 0.003 264);
        --foreground: oklch(0.21 0.02 264);
        --card: oklch(1 0 0);
        --border: oklch(0.915 0.005 264);
        --muted-foreground: oklch(0.47 0.018 264);
        --primary: oklch(0.47 0.16 277);
        --primary-hover: oklch(0.42 0.15 277);
        --ring: oklch(0.47 0.16 277 / 0.5);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: oklch(0.17 0.006 270);
          --foreground: oklch(0.95 0.004 264);
          --card: oklch(0.205 0.007 270);
          --border: oklch(0.28 0.007 270);
          --muted-foreground: oklch(0.73 0.012 264);
          --primary: oklch(0.55 0.15 277);
          --primary-hover: oklch(0.5 0.15 277);
          --ring: oklch(0.55 0.15 277 / 0.5);
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--background);
        color: var(--foreground);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      main {
        width: 100%;
        max-width: 400px;
        padding: 32px 24px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        text-align: center;
      }
      h1 { margin: 16px 0 4px; font-size: 20px; line-height: 1.3; font-weight: 600; }
      p { margin: 0 0 24px; color: var(--muted-foreground); }
      button {
        height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover { background: var(--primary-hover); }
      button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
      @media (min-width: 768px) { button { height: 40px; } }
    </style>
  </head>
  <body>
    <main>
      <svg width="48" height="48" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#484BB2" />
        <text x="16" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">B</text>
      </svg>
      <h1>Нет соединения</h1>
      <p>Проверьте интернет и попробуйте ещё раз. Записи никуда не делись.</p>
      <button type="button" onclick="location.reload()">Повторить</button>
    </main>
  </body>
</html>
